        /* प्रचार पोस्टर कंटेनर स्टाइलिंग */
        .poster-container {
            width: 100%;

            /* ताकि यह विज्ञापन स्लॉट से छोटा दिखे */

        }
        .header-gp {
            background-color: #138808; /* हरा बैकग्राउंड */
            color: #FFFFFF;
            padding: 15px 10px;
            font-size: 1.6em;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .photo-area {
            margin: 0 auto 20px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #FFD700; /* गोल्ड बॉर्डर */
        }
        .photo-area img {
            width: 100%;

            object-fit: cover;
            /* Placeholder styling */

        .candidate-name {
            font-size: 2.8em;
            font-weight: 900;

            padding: 0 10px;
        }
        .pledge-box {
            background-color: #fff8e1; /* हल्का पीला */
            border: 3px dashed #FF9933; /* नारंगी डैश बॉर्डर */
            padding: 20px;
            margin: 0 20px 30px;
            font-size: 1.15em;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }
        .pledge-box strong {
            color: #138808; /* हरा */
            font-size: 1.2em;
        }
        .call-to-action {
            font-size: 1.5em;
            font-weight: bold;
            color: #FF9933; /* नारंगी */
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .support-section {
            padding: 10px 20px;
            border-top: 2px solid #eee;
        }
        #supporterName {
            width: calc(100% - 20px);
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #000080;
            border-radius: 8px;
            font-size: 1em;
            text-align: center;
        }
        #whatsappShare {
            background-color: #138808; /* WhatsApp हरा */
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s;
        }
        #whatsappShare:hover {
            background-color: #0e6b05;
        }

    <script>
    document.getElementById('whatsappShare').addEventListener('click', function() {
        const supporterNameInput = document.getElementById('supporterName').value;
        let supporter = supporterNameInput.trim();
        
        // वर्तमान पेज का लिंक प्राप्त करना
        const pageLink = window.location.href; 
        
        // अगर नाम खाली हो, तो डिफ़ॉल्ट टेक्स्ट सेट करें
        if (supporter === "") {
            supporter = "एक जागरूक समर्थक";
        }
        
        // WhatsApp मैसेज का कंटेंट तैयार करना
        // ध्यान दें: supporter वेरिएबल का उपयोग अब मैसेज में हो रहा है
        const campaignMsg = 
            `*🙌 यह मैसेज *${supporter}* द्वारा शेयर किया गया है 🙌*\n\n` + // शेयर करने वाले का नाम सबसे ऊपर
            `*⚡️ग्राम पंचायत: हुलस खेड़ा⚡️*\n` +
            `*👑 प्रधान पद के उम्मीदवार: रवि प्रताप सिंह 👑*\n\n` +
            `मैं *${supporter}*, रवि प्रताप सिंह का तहे दिल से समर्थन करता हूँ और पूरे गाँव से निवेदन करता हूँ कि उन्हें भारी मतों से विजयी बनाएं।\n\n` +
            `*उनका वादा:*\n` +
            `_"मैं रवि प्रताप सिंह, गाँव के हर नागरिक को आश्वस्त करता हूँ कि मेरे लिए गाँव की सेवा ही मेरा धर्म है!"_\n\n` +
            `*🤝 (मैं समर्थन करता हूँ और इस मैसेज को शेयर करता हूँ) 🤝*\n\n` + 
            `*👉 आप भी समर्थन करने और यह पोस्टर देखने के लिए यहाँ क्लिक करें:*\n` + // शेयरिंग लिंक के लिए टेक्स्ट
            `${pageLink}` // शेयरिंग लिंक (वर्तमान पेज का URL)
        ;
        
        // WhatsApp शेयर लिंक बनाना
        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(campaignMsg)}`;
        
        // WhatsApp को नए टैब में खोलना
        window.open(whatsappUrl, '_blank');
    });
</script>
